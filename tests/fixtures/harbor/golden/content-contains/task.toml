schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "skill-eval/case-content-contains"
version = "1.0"
description = "skill-eval case content-contains"
authors = [{ name = "agent-skill-eval" }]

[metadata.skill_eval]
case_id = "content-contains"
tags = ["correctness"]
should_trigger = true
force_skill_invocation = false
side_effect_level = "local-only"
workdir = "/app"

[verifier]
environment_mode = "separate"
timeout_sec = 600.0

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 600.0
network_mode = "no-network"

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
workdir = "/app"
